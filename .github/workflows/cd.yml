name: CD - Train, Build & Deploy to GKE

on:
  push:
    branches: ["master"]

env:
  IMAGE_BASE: ${{ secrets.LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ secrets.ARTIFACT_REPO }}/iris-api

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 📦 Install dependencies for training
      - name: Install dependencies for training
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[gs] mlflow joblib numpy scikit-learn

      # 📥 Pull DVC data (if configured)
      - name: Pull DVC data (if configured)
        run: |
          if [ -f ".dvc/config" ]; then
            echo "Pulling dataset using DVC..."
            dvc pull || echo "No DVC remote configured or dataset already present"
          else
            echo "DVC not configured, using dataset from repo."
          fi

      # 🧠 Run model training
      - name: Run model training
        run: python train.py

      # ✅ Check model artifact exists
      - name: Check model artifact exists
        run: |
          if [ ! -f "artifacts/model_1.joblib" ]; then
            echo "❌ Model artifact missing!"
            ls -la artifacts || true
            exit 1
          fi
          echo "✅ Model artifact found."

      # 🔐 Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ☁️ Setup gcloud and GKE auth plugin
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          install_components: 'gke-gcloud-auth-plugin'

      # 🐳 Configure Docker to use gcloud credential helper
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker --quiet ${{ secrets.LOCATION }}-docker.pkg.dev

      # 🏗️ Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ env.IMAGE_BASE }}:v${{ github.run_number }}
          docker build -t "${IMAGE_TAG}" .
          docker tag "${IMAGE_TAG}" "${{ env.IMAGE_BASE }}:latest"

      # 🚀 Push Docker image to Google Artifact Registry
      - name: Push Docker image
        run: |
          IMAGE_TAG=${{ env.IMAGE_BASE }}:v${{ github.run_number }}
          docker push "${IMAGE_TAG}"
          docker push "${{ env.IMAGE_BASE }}:latest"

      # 🔧 Get GKE credentials
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE_OR_REGION }}
          project_id: ${{ secrets.GCP_PROJECT }}

      # 📄 Apply K8s manifests (ensure resources exist)
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          # Apply HPA for autoscaling demo: min=1, max=3
          kubectl apply -f k8s/hpa.yml

      # 🚢 Rollout with new image
      - name: Set image and rollout
        run: |
          IMAGE_TAG=${{ env.IMAGE_BASE }}:v${{ github.run_number }}
          kubectl set image deployment/iris-api iris-api=${IMAGE_TAG} --record || true
          kubectl rollout status deployment/iris-api --timeout=120s

  stress-test:
    runs-on: ubuntu-latest
    needs: build-deploy
    steps:
      # Reuse creds to talk to the same cluster
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE_OR_REGION }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Wait for Service external IP
        id: svc-ip
        run: |
          set -e
          for i in {1..30}; do
            IP=$(kubectl get svc iris-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || true)
            if [ -n "$IP" ]; then
              echo "SERVICE_IP=$IP" >> $GITHUB_ENV
              echo "Service IP: $IP"
              exit 0
            fi
            echo "Waiting for LoadBalancer IP ($i/30)..."
            sleep 10
          done
          echo "Service external IP not available." >&2
          exit 1

      - name: Smoke check
        run: |
          echo "HPA status:"
          kubectl get hpa iris-api-hpa || true
          echo "Pods:"
          kubectl get pods -o wide || true
          echo "Service:"
          kubectl get svc iris-api -o wide || true

      - name: Stress test - autoscaling on (1000 concurrent)
        run: |
          echo "Running wrk @ 1000 connections for 30s..."
          wrk -t12 -c1000 -d30s http://$SERVICE_IP:8080/ || true
          echo "Check HPA & pods after load:"
          kubectl get hpa iris-api-hpa
          kubectl get pods -o wide

      - name: Lock HPA to 1 pod (bottleneck scenario)
        run: |
          kubectl apply -f k8s/hpa-single.yml
          kubectl get hpa iris-api-hpa

      - name: Stress test - single pod (2000 concurrent)
        run: |
          echo "Running wrk @ 2000 connections for 30s with maxReplicas=1..."
          wrk -t12 -c2000 -d30s http://$SERVICE_IP:8080/ || true
          echo "Observe bottlenecks (no scaling expected):"
          kubectl get hpa iris-api-hpa
          kubectl get pods -o wide

